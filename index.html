<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>化妝 MBTI 測驗</title>

<style>
body {
  font-family: "微軟正黑體", sans-serif;
  background: #fff7f9;
  padding: 20px;
}
.container {
  max-width: 500px;
  margin: auto;
}
h1 {
  text-align: center;
  color: #ff6b81;
}
button {
  margin: 10px;
  padding: 12px 20px;
  border: none;
  background: #ff8fa3;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}
.result {
  margin-top: 20px;
  background: white;
  padding: 20px;
  border-radius: 12px;
}
.product {
  display: flex;
  margin: 10px 0;
}
.product img {
  width: 80px;
  height: 80px;
  margin-right: 10px;
  border-radius: 8px;
}
.btn-buy {
  background: #ff5a6e;
  color: white;
  padding: 6px 12px;
  border-radius: 6px;
  text-decoration: none;
}
</style>

</head>

<body>

<div class="container">

<h1>💄 化妝 MBTI 測驗</h1>

<div id="quiz">
  <p id="question"></p>
  <button onclick="answer('A')">A</button>
  <button onclick="answer('B')">B</button>
</div>

<div id="result" class="result" style="display:none;"></div>

</div>

<script>

// ===== 測驗題 =====
const questions = [
  {q:"你化完妝最在意的是？", A:"別人有沒有發現、稱讚", B:"自己看鏡子覺得舒服就好", type:["E","I"]},
  {q:"你覺得一個妝好看是因為？", A:"很乾淨、沒有瑕疵", B:"有氛圍感、很有風格", type:["S","N"]},
  {q:"選化妝品時你會？", A:"看成分、功能、評價", B:"看感覺、包裝", type:["T","F"]},
  {q:"你的化妝習慣？", A:"固定流程", B:"看心情", type:["J","P"]}
];

let current = 0;
let result = [];

function showQuestion() {
  document.getElementById("question").innerText =
    questions[current].q + "\nA: " + questions[current].A + "\nB: " + questions[current].B;
}

function answer(choice) {
  result.push(choice==="A"?questions[current].type[0]:questions[current].type[1]);
  current++;
  if(current < questions.length){
    showQuestion();
  } else {
    showResult();
  }
}

// ===== MBTI資料 =====
const data = {
"INFP": {
  title:"人間仙女",
  makeup:"溫柔氛圍妝",
  desc:"性格溫柔的你，自帶一種自然又柔和的氛圍感，低飽和粉調最適合你。",
  model:"images/models/INFP.jpg",
  products:[
    {name:"小白桃", img:"images/小白桃.png", link:"https://www.amfairyland.com/products/%E2%98%85%E6%BE%8E%E6%BE%8E%E7%A7%98%E5%85%89%E5%B0%8F%E8%87%89%E7%9B%A4%E3%83%BB%E7%B2%89%E7%B2%89%E9%A6%A5%E7%BE%8E%EF%BD%9C%E5%B0%8F%E7%99%BD%E6%A1%83"},
    {name:"輕裸肌蜜粉02柔霧", img:"images/小空氣蜜粉-02柔霧.png", link:"https://www.amfairyland.com/products/light-setting-powder-2"}
  ]
},

"ENFP": {
  title:"元氣少女",
  makeup:"活力果汁妝",
  desc:"你天生很有感染力，適合橘粉色系，讓整體更有活力。",
  model:"images/models/ENFP.jpg",
  products:[
    {name:"妝前乳", img:"images/products/ENFP_1.jpg", link:"#"},
    {name:"小金桃", img:"images/products/ENFP_2.jpg", link:"#"},
    {name:"潤唇膏", img:"images/products/ENFP_3.jpg", link:"#"}
  ]
},

// 👉（中間16型我幫你保留，避免太長，你直接用我前面那份完整貼進來）

};

// ===== 顯示結果 =====
function showResult(){
  document.getElementById("quiz").style.display="none";
  const mbti = result.join("");
  const info = data[mbti];

  let html = `
    <h2>${mbti}｜${info.title}</h2>

    <img src="${info.model}" style="width:100%; border-radius:12px; margin:15px 0;">

    <p><b>👉 命定妝容：</b>${info.makeup}</p>

    <p style="margin:10px 0;">${info.desc}</p>

    <p><b>👉 推薦產品：</b></p>
  `;

  info.products.forEach(p=>{
    html += `
      <div class="product">
        <img src="${p.img}">
        <div>
          <p>${p.name}</p>
          <a href="${p.link}" class="btn-buy" target="_blank">立即購買</a>
        </div>
      </div>
    `;
  });

  document.getElementById("result").style.display="block";
  document.getElementById("result").innerHTML = html;
}

showQuestion();

</script>

</body>
</html>
